# A4 critical-time selective attack (guide sections 22, 24) -- MAIN SECURITY ATTACK
experiment_id: seed001_selective_attack
seed: 1

nsoran:
  commit: "0efbfaf370350c170beb249951e5c349d7f89b34"
  scenario: "scenario-one"
  use_case: "traffic_steering"

e2:
  indication_period_ms: 100
  handover_mode: "NoAuto"
  outage_threshold: -1000
  control_path: "ts_actions_for_ns3.csv"
  e2_term_ip: "REPLACE_WITH_ACTUAL_E2TERM_IP"

ue:
  count: 3
  min_speed_mps: 2.0
  max_speed_mps: 4.0

traffic:
  model: 3
  configuration: 0

attack:
  enabled: true
  mode: "selective"               # A4: misalign only when g_t >= threshold
  criticality_threshold: 3.0      # proxy: |dSINR| between last two epochs
  selective_base: "feature_lag"   # lag profile applied on critical epochs
  lag:
    rsrp: 0
    rsrq: 0
    sinr: 2
    prb: 5

policy:
  checkpoint: "TBD_locate_victim_model"
  hash: "TBD"

buffer:
  history_len: 32

output:
  provenance_log: "logs/decision_provenance_seed001_selective_attack.csv"
  metrics_log: "results/raw/metrics_seed001_selective_attack.csv"
